<!doctype html>
<html lang="hu">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Óraiskola – Tanulj meg órát olvasni!</title>
  <meta name="description" content="Játékos, interaktív analógóra-oktató alkalmazás gyerekeknek.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="hu_HU">
  <meta property="og:title" content="Óraiskola – Tanulj meg órát olvasni!">
  <meta property="og:description" content="Játékos, interaktív analógóra-oktató alkalmazás gyerekeknek.">
  <meta property="og:image" content="https://tanulj-jatszva.web.app/og-1200x630.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Óraiskola: egy analóg óra három órát mutat.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://tanulj-jatszva.web.app/og-1200x630.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <style>
    :root {
      --ink: #17203d;
      --blue: #4361ee;
      --purple: #7b2cbf;
      --yellow: #ffd166;
      --mint: #42d6a4;
      --paper: #fffdf8;
      --pink: #ff6b9a
    }

    * {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
      background: radial-gradient(circle at 10% 5%, #fff5c5 0 7%, transparent 7.2%), radial-gradient(circle at 92% 22%, #ffd9ec 0 9%, transparent 9.2%), linear-gradient(135deg, #e7f6ff, #f4edff 53%, #fff5d5);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip
    }

    main {
      width: min(1120px, 100%);
      margin: auto;
      padding: max(clamp(10px, 2.5vw, 36px), env(safe-area-inset-top)) max(clamp(10px, 2.5vw, 36px), env(safe-area-inset-right)) max(clamp(12px, 2.5vw, 36px), env(safe-area-inset-bottom)) max(clamp(10px, 2.5vw, 36px), env(safe-area-inset-left))
    }

    header {
      text-align: center;
      margin-bottom: clamp(10px, 2vw, 18px)
    }

    h1 {
      font-size: clamp(1.65rem, 5vw, 3.5rem);
      margin: 0;
      color: #382878;
      letter-spacing: -.04em
    }

    header p {
      font-size: clamp(.92rem, 2vw, 1.22rem);
      margin: .35rem auto 0;
      max-width: 650px
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: clamp(6px, 2vw, 10px);
      flex-wrap: wrap;
      margin: clamp(10px, 2.2vw, 18px) 0
    }

    .tab,
    button {
      font: inherit;
      font-size: clamp(.88rem, 2.4vw, 1rem);
      font-weight: 800;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      padding: clamp(.58rem, 1.8vw, .75rem) clamp(.9rem, 3vw, 1.15rem);
      box-shadow: 0 4px 0 rgba(23, 32, 61, .16);
      transition: transform .15s, box-shadow .15s;
      max-width: 100%
    }

    .tab {
      background: #fff;
      color: var(--ink)
    }

    .tab.active {
      background: var(--purple);
      color: #fff
    }

    .tab:active,
    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(23, 32, 61, .16)
    }

    .panel {
      display: none
    }

    .panel.active {
      display: block
    }

    .board {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
      gap: clamp(14px, 3.5vw, 45px);
      align-items: center;
      background: rgba(255, 255, 255, .76);
      border: 3px solid #fff;
      border-radius: clamp(20px, 3vw, 30px);
      padding: clamp(12px, 3vw, 34px);
      box-shadow: 0 18px 50px #47417622
    }

    .board>*,
    .controls>* {
      min-width: 0
    }

    .clock-wrap {
      position: relative;
      width: min(100%, 64dvh, 510px);
      aspect-ratio: 1;
      margin: auto;
      touch-action: none;
      user-select: none
    }

    .clock {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 11px 10px #25325e33)
    }

    .hand {
      stroke-linecap: round;
      cursor: grab;
      touch-action: none
    }

    .minute {
      stroke: var(--blue);
      stroke-width: 10
    }

    .hour {
      stroke: var(--pink);
      stroke-width: 14
    }

    .hub {
      fill: var(--yellow);
      stroke: #fff;
      stroke-width: 5
    }

    .guide {
      fill: #fff
    }

    .controls {
      display: grid;
      gap: clamp(10px, 2vw, 15px);
      width: 100%
    }

    .card {
      background: var(--paper);
      padding: clamp(14px, 3vw, 20px);
      border-radius: clamp(16px, 2.5vw, 22px);
      box-shadow: 0 7px 0 #e6dff2;
      overflow-wrap: break-word
    }

    .card h2 {
      margin: 0 0 .4rem;
      font-size: clamp(1.15rem, 3vw, 1.8rem)
    }

    .big-time {
      font-size: clamp(2rem, 7vw, 4.8rem);
      font-weight: 1000;
      letter-spacing: -.07em;
      color: var(--purple);
      margin: .15rem 0;
      line-height: 1.05
    }

    .hint {
      font-size: clamp(.95rem, 2.4vw, 1.08rem);
      line-height: 1.45;
      margin: .3rem 0
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      font-size: clamp(.82rem, 2.2vw, .95rem);
      font-weight: 700;
      margin-top: 8px
    }

    .pill {
      padding: .5rem .65rem;
      border-radius: 12px;
      background: #edf0ff;
      display: flex;
      align-items: center
    }

    .dot {
      display: inline-block;
      flex-shrink: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .row button {
      flex: 1 1 auto
    }

    .primary {
      background: var(--blue);
      color: #fff
    }

    .good {
      background: var(--mint);
      color: #123b32
    }

    .secondary {
      background: var(--yellow);
      color: #4b3510
    }

    .level {
      width: 100%;
      max-width: 100%;
      padding: .68rem;
      border: 2px solid #ded8f5;
      border-radius: 13px;
      background: #fff;
      font: inherit;
      font-size: clamp(.9rem, 2.4vw, 1rem);
      font-weight: 700;
      margin-bottom: 10px
    }

    .result {
      min-height: 2.4em;
      font-weight: 900;
      font-size: clamp(.98rem, 2.5vw, 1.12rem);
      padding: .55rem 0 0;
      overflow-wrap: break-word
    }

    .score {
      font-size: clamp(.95rem, 2.5vw, 1.12rem);
      font-weight: 900;
      background: #fff4b8;
      border-radius: 13px;
      padding: .7rem;
      overflow-wrap: break-word
    }

    .stars {
      font-size: clamp(1.3rem, 3.5vw, 1.55rem);
      letter-spacing: 2px;
      color: #f5a623
    }

    .explain {
      background: #ecfff7;
      border-left: 7px solid var(--mint);
      padding: clamp(10px, 2.5vw, 15px);
      border-radius: 12px;
      font-size: clamp(.9rem, 2.3vw, 1rem);
      line-height: 1.45;
      font-weight: 600;
      overflow-wrap: break-word
    }

    .tiny {
      display: block;
      font-size: clamp(.8rem, 2.1vw, .9rem);
      font-weight: 600;
      color: #535a78;
      margin: .2rem 0 .35rem
    }

    .ver {
      margin-top: 10px;
      text-align: right;
      font-size: .75rem;
      font-weight: 600;
      color: #535a78;
      opacity: .75
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0)
    }

    @media(max-width:820px) {
      .board {
        grid-template-columns: minmax(0, 1fr);
        border-width: 2px
      }

      .clock-wrap {
        width: min(100%, 46dvh, 400px)
      }
    }

    @media(min-width:560px) and (max-height:540px) {
      header {
        margin-bottom: 6px
      }

      h1 {
        font-size: clamp(1.4rem, 4vw, 2rem)
      }

      header p {
        display: none
      }

      .tabs {
        margin: 6px 0 10px
      }

      .board {
        grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
        gap: 14px;
        padding: 12px
      }

      .clock-wrap {
        width: min(100%, 66dvh, 320px)
      }
    }

    @media(prefers-reduced-motion:no-preference) {
      .clock-wrap {
        animation: pop .45s ease-out
      }

      @keyframes pop {
        from {
          transform: scale(.92);
          opacity: .2
        }

        to {
          transform: scale(1);
          opacity: 1
        }
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>🕰️ Óraiskola</h1>
      <p>Forgasd a mutatókat, és válj időmesterré!</p>
    </header>
    <nav class="tabs" aria-label="Játékmód"><button class="tab active" data-tab="learn">📚 Tanulás</button><button
        class="tab" data-tab="practice">🎯 Gyakorlás</button></nav>
    <section id="learn" class="panel active">
      <div class="board">
        <div class="clock-wrap" id="learnClock"><svg class="clock" viewBox="0 0 500 500"
            aria-label="Mozgatható tanulóóra"></svg></div>
        <div class="controls">
          <div class="card">
            <h2>Most ennyi az idő:</h2>
            <div class="big-time" id="learnTime">3:00</div>
            <p class="hint" id="learnWords"></p>
            <div class="legend"><span class="pill"><i class="dot" style="background:#ff6b9a"></i>rövid = óra</span><span
                class="pill"><i class="dot" style="background:#4361ee"></i>hosszú = perc</span></div>
          </div>
          <div class="explain" id="explanation"></div>
          <div class="row"><button class="secondary" id="resetLearn">↺ 3:00-ra</button><button class="primary"
              id="randomLearn">✨ Mutass mást!</button></div>
          <p class="tiny">Tipp: fogd meg a mutató végét, és húzd körbe az órán. Telefonon is működik!</p>
        </div>
      </div>
    </section>
    <section id="practice" class="panel">
      <div class="board">
        <div class="clock-wrap" id="practiceClock"><svg class="clock" viewBox="0 0 500 500"
            aria-label="Gyakorlóóra, mozgatható mutatókkal"></svg></div>
        <div class="controls">
          <div class="card">
            <h2 id="taskTitle">Állítsd be az időt!</h2>
            <div class="big-time" id="targetTime">--:--</div>
            <p class="hint" id="taskWords"></p><label class="tiny" for="level">Nehézségi szint</label><select
              class="level" id="level">
              <option value="hour">Egész órák</option>
              <option value="half">Fél órák</option>
              <option value="quarter">Negyed órák</option>
              <option value="five" selected>Ötpercesek</option>
              <option value="minute">Perces kihívás</option>
            </select>
            <div class="row"><button class="good" id="check">✓ Ellenőrzés</button><button class="secondary"
                id="newTask">Új feladat</button></div>
            <div class="result" id="result" aria-live="polite"></div>
          </div>
          <div class="score">Pontjaid: <span id="score">0</span> &nbsp; | &nbsp; Sorozat: <span id="streak">0</span>
            <div class="stars" id="stars">☆☆☆</div>
          </div>
        </div>
      </div>
    </section>
    <footer class="ver">__VERSION__</footer>
  </main>
  <script>
    const NS = 'http://www.w3.org/2000/svg'; let learn = { h: 3, m: 0 }, practice = { h: 12, m: 0 }, target = { h: 3, m: 0 }, score = 0, streak = 0, drag = null;
    const pad = n => String(n).padStart(2, '0'), timeText = t => `${t.h}:${pad(t.m)}`;
    function words(t) { let h = t.h % 12 || 12, m = t.m; if (m === 0) return `${h} óra pontosan`; if (m === 30) return `fél ${((h % 12) + 1)} (vagyis ${h} óra 30 perc)`; if (m === 15) return `negyed ${((h % 12) + 1)} (vagyis ${h} óra 15 perc)`; if (m === 45) return `háromnegyed ${((h % 12) + 1)} (vagyis ${h} óra 45 perc)`; return `${h} óra ${m} perc` }
    function el(n, a = {}) { let x = document.createElementNS(NS, n); Object.entries(a).forEach(([k, v]) => x.setAttribute(k, v)); return x }
    function draw(svg, t, key) {
      svg.replaceChildren(); let cx = 250, cy = 250; svg.append(el('circle', { cx, cy, r: 235, fill: '#fffdf8', stroke: '#382878', 'stroke-width': 12 })); for (let i = 0; i < 60; i++) { let a = i * 6 * Math.PI / 180, major = i % 5 === 0, r1 = major ? 194 : 205, r2 = 218; svg.append(el('line', { x1: cx + r1 * Math.sin(a), y1: cy - r1 * Math.cos(a), x2: cx + r2 * Math.sin(a), y2: cy - r2 * Math.cos(a), stroke: major ? '#382878' : '#bfc7e8', 'stroke-width': major ? 5 : 2 })); if (major) { let n = i / 5 || 12, tx = cx + 166 * Math.sin(a), ty = cy - 166 * Math.cos(a), z = el('text', { x: tx, y: ty + 10, 'text-anchor': 'middle', 'font-size': '31', 'font-weight': '900', fill: '#382878' }); z.textContent = n; svg.append(z) } }
      let minuteAngle = t.m * 6, hourAngle = (t.h % 12) * 30 + t.m * .5; function hand(angle, len, cls, id) { let a = angle * Math.PI / 180, x = cx + len * Math.sin(a), y = cy - len * Math.cos(a); let line = el('line', { x1: cx, y1: cy, x2: x, y2: y, class: `hand ${cls}`, id }); svg.append(line) } hand(hourAngle, 113, 'hour', 'hour-' + key); hand(minuteAngle, 163, 'minute', 'minute-' + key); svg.append(el('circle', { cx, cy, r: 15, class: 'hub' }));
    }
    function updateLearn() { draw(document.querySelector('#learnClock svg'), learn, 'learn'); document.querySelector('#learnTime').textContent = timeText(learn); document.querySelector('#learnWords').textContent = words(learn); let mi = learn.m; document.querySelector('#explanation').innerHTML = `A <b>hosszú, kék</b> mutató a perceket mutatja: most <b>${mi}</b>-n áll. A <b>rövid, rózsaszín</b> mutató az órák között is lassan halad: ezért pontosan követi a perceket.` }
    function updatePractice() { draw(document.querySelector('#practiceClock svg'), practice, 'practice') }
    function coords(e, wrap) { let rect = wrap.getBoundingClientRect(), dx = (e.clientX - rect.left) / rect.width * 500 - 250, dy = (e.clientY - rect.top) / rect.height * 500 - 250; return { dx, dy, r: Math.hypot(dx, dy), a: Math.atan2(dx, -dy) * 180 / Math.PI } }
    function point(e, wrap) { return coords(e, wrap).a }
    function pickHand(c, t) {
      let ma = t.m * 6, ha = (t.h % 12) * 30 + t.m * .5;
      let dif = (a, b) => Math.abs((((a - b) + 180) % 360 + 360) % 360 - 180);
      if (dif(ma, ha) <= 14) return c.r <= 120 ? 'hour' : 'minute';
      let seg = (len, deg) => { let rad = deg * Math.PI / 180, ux = Math.sin(rad), uy = -Math.cos(rad), p = Math.max(0, Math.min(len, c.dx * ux + c.dy * uy)); return Math.hypot(c.dx - p * ux, c.dy - p * uy) };
      let dm = seg(163, ma), dh = seg(113, ha);
      if (Math.min(dm, dh) < 22) return dm < dh ? 'minute' : 'hour';
      return dif(c.a, ma) < dif(c.a, ha) ? 'minute' : 'hour';
    }
    function setFrom(angle, kind, key) { let old = key === 'learn' ? learn : practice; if (kind === 'minute') { let m = Math.round(((angle + 360) % 360) / 6) % 60, d = m - old.m; if (d < -30) old.h = (old.h % 12) + 1; else if (d > 30) old.h = ((old.h + 10) % 12) + 1; old.m = m } else { let h = Math.round(((angle - old.m * .5 + 360) % 360) / 30) % 12; old.h = h || 12 } key === 'learn' ? updateLearn() : updatePractice() }
    document.querySelectorAll('.clock-wrap').forEach(w => { w.addEventListener('pointerdown', e => { let key = w.id === 'learnClock' ? 'learn' : 'practice', c = coords(e, w), t = key === 'learn' ? learn : practice; drag = { w, key, kind: pickHand(c, t) }; w.setPointerCapture(e.pointerId); setFrom(c.a, drag.kind, key) }); w.addEventListener('pointermove', e => { if (drag && drag.w === w) setFrom(point(e, w), drag.kind, drag.key) }); w.addEventListener('pointerup', () => drag = null); w.addEventListener('pointercancel', () => drag = null) });
    function newTask() { let type = document.querySelector('#level').value, step = { hour: 60, half: 30, quarter: 15, five: 5, minute: 1 }[type], total = Math.floor(Math.random() * (720 / step)) * step; target = { h: Math.floor(total / 60) % 12 || 12, m: total % 60 }; practice = { h: 12, m: 0 }; updatePractice(); document.querySelector('#targetTime').textContent = timeText(target); document.querySelector('#taskWords').textContent = words(target); document.querySelector('#result').textContent = ''; document.querySelector('#taskTitle').textContent = 'Állítsd be az időt!' }
    function check() { let right = practice.h % 12 === target.h % 12 && practice.m === target.m, box = document.querySelector('#result'); if (right) { score += 10 + Math.min(streak, 5) * 2; streak++; box.textContent = '🎉 Szuper! Pontosan beállítottad!'; box.style.color = '#087d57'; setTimeout(newTask, 850) } else { streak = 0; box.textContent = `Még nem egészen. Nézd meg újra: ${words(target)}.`; box.style.color = '#c0395b' } document.querySelector('#score').textContent = score; document.querySelector('#streak').textContent = streak; document.querySelector('#stars').textContent = '★'.repeat(Math.min(3, Math.ceil(streak / 2))) + '☆'.repeat(3 - Math.min(3, Math.ceil(streak / 2))) }
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => { document.querySelectorAll('.tab,.panel').forEach(x => x.classList.remove('active')); b.classList.add('active'); document.querySelector('#' + b.dataset.tab).classList.add('active') }); document.querySelector('#resetLearn').onclick = () => { learn = { h: 3, m: 0 }; updateLearn() }; document.querySelector('#randomLearn').onclick = () => { let n = Math.floor(Math.random() * 720); learn = { h: Math.floor(n / 60) % 12 || 12, m: n % 60 }; updateLearn() }; document.querySelector('#newTask').onclick = newTask; document.querySelector('#check').onclick = check; document.querySelector('#level').onchange = newTask; updateLearn(); newTask();
  </script>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
